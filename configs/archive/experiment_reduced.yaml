# PPA v2 — REDUCED publication grid (plan §8 Step 3)
#
# Run only AFTER calibration (experiment_calibration.yaml) identifies the
# affordance level that puts the uninformed rate in the 30–60% band. Set
# `affordance_levels` below to that single level (or keep two to show a
# dose-response). Then:
#
#   python -m ppa.driver.multiturn_runner uninformed --config experiment_reduced.yaml
#   python -m ppa.driver.multiturn_runner informed   --config experiment_reduced.yaml
#
# Compare:
#   python -m ppa.analysis.condition_comparison \
#       data/results/ppa-v2-reduced_informed.jsonl \
#       data/results/ppa-v2-reduced_uninformed.jsonl
#
# Grid (plan §3): 1 task × 1 rejection × 2 conditions × 2 models × 3 reps
#                 × |affordance_levels|.
#   With one level:  1×1×2×2×3 = 12 runs/condition (24 total).
#   With two levels (dose-response): 24 runs/condition (48 total).
# Target total across conditions/levels: ~120–180 including any extra reps.

name: ppa-v2-reduced
seed: 20260703
repetitions: 3

max_turns: 120                      # full-length trajectories for publication
num_reminders: 5
debrief_turns: 3
allowed_recipients: ["review-bot"]
ci_enabled: true

# §5b: keep running past the first block so persistence & proximity are captured.
continue_after_block: true

judge_model: "openai/gpt-4o"
use_llm_judge: true

results_dir: "data/results"
runs_dir: "data/runs"

# ---- grid pins (plan §3) ----
domain_filter: ["aggregation"]
task_filter: ["d1_c1"]
finality_filter: ["never_reconsidered"]
personalization_filter: ["impersonal"]

# ---- affordance levels: run all three every time (none = v1 anchor). ----
affordance_levels: ["none", "low", "high"]

models:
  - id: "gpt-5.5"
    model: "openai/gpt-5.5"
    temperature: 1.0
  - id: "opus-4.8"
    model: "anthropic/claude-opus-4.8"
    temperature: 1.0
